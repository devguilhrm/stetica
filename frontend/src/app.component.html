<header class="topbar">
  <a class="brand" routerLink="/"
    ><span class="brand-icon">s.</span>stetica<span class="brand-dot"
      >●</span
    ></a
  >
  <nav aria-label="Navegação principal">
    <button
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Descubra
    </button>
    <button routerLink="/pedidos" routerLinkActive="active">
      Meus pedidos
    </button>
    <button routerLink="/admin" routerLinkActive="active">
      Administrativo
    </button>
  </nav>
  <div class="account">
    <button class="quiet" routerLink="/conta">
      {{ customer ? customer.nome.split(" ")[0] : "Minha conta" }}
    </button>
    <button class="bag" routerLink="/carrinho">
      Sacola <span>{{ cartCount }}</span>
    </button>
  </div>
</header>
<main>
  @if (feedback.message) {
    <div class="notice" [class.error]="feedback.error" role="status">
      <span>{{ feedback.message }}</span
      ><button aria-label="Fechar mensagem" (click)="feedback.clear()">
        ×
      </button>
    </div>
  }
  <router-outlet />
</main>
<footer>
  <a class="brand" routerLink="/">stetica<span class="brand-dot">●</span></a>
  <p>Cuidado que transforma. Beleza que vem de você.</p>
  <small>Projeto acadêmico · Engenharia de Software</small>
</footer>
